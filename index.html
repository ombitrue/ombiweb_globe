<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глобальный Гео-Дашборд Pro</title>
  
  <script src="https://unpkg.com/globe.gl"></script>
  
  <style>
    body {
      margin: 0;
      background-color: #050811;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    #globe-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0; left: 0;
    }

    /* ПОИСК: теперь перенесен в правый верхний угол, чтобы не мешать плашке */
    .search-panel {
      position: absolute;
      top: 25px; right: 25px;
      z-index: 1000;
      background: rgba(10, 15, 30, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
      backdrop-filter: blur(10px);
      display: flex; gap: 8px;
    }

    .search-input {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 6px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      width: 220px;
    }

    .search-input:focus {
      border-color: #00f0ff;
    }

    .search-btn {
      background: #00f0ff;
      color: #050811;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    /* ПЛАШКА ДАННЫХ: теперь в левом верхнем углу, зафиксирована и не прыгает под мышкой */
    .custom-tooltip {
      position: absolute;
      top: 25px; left: 25px;
      background: rgba(7, 11, 22, 0.95);
      border: 1px solid #00f0ff;
      border-radius: 12px;
      padding: 18px;
      color: #fff;
      font-size: 14px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.35);
      z-index: 1000;
      min-width: 280px;
      backdrop-filter: blur(12px);
      display: none; /* Включается при наведении */
    }

    .tooltip-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #00f0ff;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 8px;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }

    .metric-label { color: #a0aec0; }
    .metric-value { font-weight: 600; color: #ffffff; }
    
    .highlight-fb { color: #1877F2; }
    .highlight-cards { color: #4cd964; }
    .highlight-gambling { color: #ff3b30; }

    #loader {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px; color: #00f0ff;
      z-index: 2000; letter-spacing: 3px;
    }
  </style>
</head>
<body>

  <div id="loader">ЗАГРУЗКА ВСЕХ СТРАН МИРА...</div>

  <div id="tooltip" class="custom-tooltip">
    <div id="tt-title" class="tooltip-title">Выведи курсор</div>
    <div class="metric"><span class="metric-label">ISO 2 Код:</span> <span id="tt-iso" class="metric-value" style="color: #a0aec0;"></span></div>
    <div class="metric"><span class="metric-label">Общее население:</span> <span id="tt-pop" class="metric-value"></span></div>
    <div class="metric"><span class="metric-label">Охват Facebook:</span> <span id="tt-fb" class="metric-value highlight-fb"></span></div>
    <div class="metric"><span class="metric-label">Банк. карты / Моб:</span> <span id="tt-cards" class="metric-value highlight-cards"></span></div>
    <div class="metric"><span class="metric-label">Риск гемблинга:</span> <span id="tt-gambling" class="metric-value highlight-gambling"></span></div>
  </div>

  <div class="search-panel">
    <input type="text" id="search-in" class="search-input" placeholder="Код (UA) или Название...">
    <button id="search-btn" class="search-btn">Найти</button>
  </div>

  <div id="globe-container"></div>

  <script>
    let world = null;
    let marketingData = {}; 
    let geoJsonFeatures = [];

    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttIso = document.getElementById('tt-iso');
    const ttPop = document.getElementById('tt-pop');
    const ttFb = document.getElementById('tt-fb');
    const ttCards = document.getElementById('tt-cards');
    const ttGambling = document.getElementById('tt-gambling');
    const loader = document.getElementById('loader');

    function setSafeText(element, value) {
      element.textContent = value || 'н/д';
    }

    async function initApp() {
      try {
        // 1. Читаем кастомные данные из локального data.json (без ошибок кодировки)
        try {
          const marketingRes = await fetch('./data.json');
          if (marketingRes.ok) marketingData = await marketingRes.json();
        } catch (e) { console.log("Файл data.json отсутствует, работаем по дефолту"); }

        // 2. Скачиваем официальные контуры В С Е Х стран мира (GeoJSON) - рендерится без лагов
        const geoRes = await fetch('https://raw.githubusercontent.com/vasturiano/three-globe/master/example/datasets/ne_110m_admin_0_countries.geojson');
        const geoData = await geoRes.json();
        geoJsonFeatures = geoData.features;

        // 3. Скачиваем официальные переводы названий стран на русский язык и население
        const apiRes = await fetch('https://restcountries.com/v3.1/all?fields=cca2,population,translations');
        if (apiRes.ok) {
          const apiData = await apiRes.json();
          apiData.forEach(c => {
            const iso2 = c.cca2;
            // Если в data.json этой страны нет, создаем под нее пустую структуру
            if (!marketingData[iso2]) {
              marketingData[iso2] = { fb: "н/д", cards: "н/д", gambling: "н/д" };
            }
            // Подшиваем правильное русское название и население к нашей базе данных
            marketingData[iso2].population = c.population.toLocaleString('ru-RU');
            marketingData[iso2].nameFromApi = c.translations?.rus?.common || c.translations?.eng?.common || iso2;
          });
        }

        loader.style.display = 'none';
        buildGlobe();

      } catch (err) {
        console.error(err);
        loader.textContent = "СЕТЕВАЯ ОШИБКА. ПЕРЕЗАГРУЗИТЕ СТРАНИЦУ.";
      }
    }

    function buildGlobe() {
      world = Globe()
        (document.getElementById('globe-container'))
        // Используем базовые легкие текстуры, чтобы Render не зависал
        .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
        .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
        .polygonsData(geoJsonFeatures)
        
        // Красивый стиль: полупрозрачные страны с неоновым контуром
        .polygonCapColor(() => 'rgba(0, 150, 255, 0.04)')
        .polygonSideColor(() => 'rgba(5, 10, 20, 0.5)')
        .polygonStrokeColor(() => 'rgba(0, 240, 255, 0.5)')
        .polygonLineWidth(0.6)

        .onPolygonHover(hoverD => {
          if (hoverD) {
            // Подсветка страны при наведении
            world.polygonCapColor(d => d === hoverD ? 'rgba(0, 240, 255, 0.25)' : 'rgba(0, 150, 255, 0.04)');
            world.polygonStrokeColor(d => d === hoverD ? '#00f0ff' : 'rgba(0, 240, 255, 0.5)');
            
            const iso2 = hoverD.properties.ISO_A2;
            const data = marketingData[iso2];

            // Заполняем зафиксированную плашку
            setSafeText(ttTitle, data?.nameRu || data?.nameFromApi || hoverD.properties.NAME);
            setSafeText(ttIso, iso2 !== "-99" ? iso2 : "н/д");
            setSafeText(ttPop, data?.population);
            setSafeText(ttFb, data?.fb);
            setSafeText(ttCards, data?.cards);
            setSafeText(ttGambling, data?.gambling);
            
            tooltip.style.display = 'block';
          } else {
            // Возвращаем все в норму, когда мышь ушла, но плашку не прячем (чтобы текст оставался)
            world.polygonCapColor(() => 'rgba(0, 150, 255, 0.04)');
            world.polygonStrokeColor(() => 'rgba(0, 240, 255, 0.5)');
          }
        });

      world.controls().autoRotate = true;
      world.controls().autoRotateSpeed = 0.3;
    }

    function handleSearch() {
      const query = document.getElementById('search-in').value.trim().toUpperCase();
      if (!query || !world) return;

      let targetIso2 = null;

      // Ищем по ISO коду
      if (marketingData[query]) {
        targetIso2 = query;
      } else {
        // Ищем по русскому имени
        for (const [iso, data] of Object.entries(marketingData)) {
          if ((data.nameRu && data.nameRu.toUpperCase().includes(query)) || 
              (data.nameFromApi && data.nameFromApi.toUpperCase().includes(query))) {
            targetIso2 = iso;
            break;
          }
        }
      }

      if (targetIso2) {
        const feature = geoJsonFeatures.find(f => f.properties.ISO_A2 === targetIso2);
        if (feature && feature.properties) {
          world.controls().autoRotate = false;
          const lat = feature.properties.LABEL_Y;
          const lng = feature.properties.LABEL_X;

          if (lat !== undefined && lng !== undefined) {
            // Плавный полет камеры к центру страны
            world.pointOfView({ lat: lat, lng: lng, altitude: 1.6 }, 2000);
            
            // Заставляем целевую страну загореться неоном
            world.polygonCapColor(d => d.properties.ISO_A2 === targetIso2 ? 'rgba(0, 240, 255, 0.4)' : 'rgba(0, 150, 255, 0.04)');
            world.polygonStrokeColor(d => d.properties.ISO_A2 === targetIso2 ? '#00f0ff' : 'rgba(0, 240, 255, 0.5)');

            // Имитируем наведение, чтобы плашка обновилась данными найденной страны
            const data = marketingData[targetIso2];
            setSafeText(ttTitle, data?.nameRu || data?.nameFromApi || feature.properties.NAME);
            setSafeText(ttIso, targetIso2);
            setSafeText(ttPop, data?.population);
            setSafeText(ttFb, data?.fb);
            setSafeText(ttCards, data?.cards);
            setSafeText(ttGambling, data?.gambling);
            tooltip.style.display = 'block';
          }
        }
      } else {
        alert('Страна не найдена. Введите, например: Украина, Франция, KZ, US');
      }
    }

    document.getElementById('search-btn').addEventListener('click', handleSearch);
    document.getElementById('search-in').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    initApp();
  </script>
</body>
</html>
