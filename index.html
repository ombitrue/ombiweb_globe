<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глобальный Гео-Дашборд v7.5 Fixed Pro</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/globe.gl/2.32.1/globe.gl.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  
  <style>
    body {
      margin: 0;
      background-color: #050811;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
      user-select: none;
    }
    #globe-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0; left: 0;
    }
    
    /* ПОИСК: Справа вверху */
    .search-panel {
      position: absolute;
      top: 25px; right: 25px;
      z-index: 1000;
      background: rgba(10, 15, 30, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 240, 255, 0.1);
      backdrop-filter: blur(12px);
      display: flex; gap: 10px;
    }
    .search-input {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      width: 240px;
    }
    .search-btn {
      background: #00f0ff; color: #050811;
      border: none; border-radius: 8px;
      padding: 10px 20px; font-weight: 700; cursor: pointer;
      font-size: 14px; transition: all 0.2s;
    }
    .search-btn:hover { background: #00bfff; box-shadow: 0 0 12px rgba(0, 240, 255, 0.4); }

    /* ДАШБОРД: Слева вверху */
    .custom-tooltip {
      position: absolute;
      top: 25px; left: 25px;
      background: rgba(6, 10, 23, 0.95);
      border: 1px solid #00f0ff;
      border-radius: 14px;
      padding: 20px; 
      color: #fff; 
      font-size: 14px;
      pointer-events: none;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 240, 255, 0.25);
      z-index: 1000; 
      min-width: 300px;
      backdrop-filter: blur(15px);
    }
    .tooltip-title {
      font-size: 22px; font-weight: 700; margin-bottom: 14px;
      color: #00f0ff; border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 8px;
    }
    .metric { display: flex; justify-content: space-between; margin: 11px 0; }
    .metric-label { color: #a0aec0; }
    .metric-value { font-weight: 600; color: #ffffff; }
    .highlight-fb { color: #1877F2; }
    .highlight-cards { color: #4cd964; }
    .highlight-gambling { color: #ff3b30; }
  </style>
</head>
<body>

  <div class="search-panel">
    <input type="text" id="search-in" class="search-input" placeholder="Введите ГЕО (Украина, Германия, US)...">
    <button id="search-btn" class="search-btn">Найти</button>
  </div>

  <div id="globe-container"></div>
  
  <div id="tooltip" class="custom-tooltip">
    <div id="tt-title" class="tooltip-title">Глобальный Мониторинг</div>
    <div class="metric"><span class="metric-label">ISO 2 Код:</span> <span id="tt-iso" class="metric-value" style="color: #a0aec0;">WORLD</span></div>
    <div class="metric"><span class="metric-label">Регион ГЕО:</span> <span id="tt-pop" class="metric-value">Вся планета</span></div>
    <div class="metric"><span class="metric-label">Охват Facebook:</span> <span id="tt-fb" class="metric-value highlight-fb">Стабилен</span></div>
    <div class="metric"><span class="metric-label">Банк. карты / Моб:</span> <span id="tt-cards" class="metric-value highlight-cards">Онлайн</span></div>
    <div class="metric"><span class="metric-label">Риск гемблинга:</span> <span id="tt-gambling" class="metric-value highlight-gambling">Анализ</span></div>
  </div>

  <script>
    let world = null;
    let activeSearchCountryIso = null;

    // Автономная база данных ГЕО с точными координатами
    const massiveDatabase = {
      "UA": { name: "Украина", reg: "Европа / СНГ", fb: "68%", cards: "84%", gambling: "14%", lat: 48.3, lng: 31.1 },
      "KZ": { name: "Казахстан", reg: "Азия / СНГ", fb: "48%", cards: "89%", gambling: "21%", lat: 48.0, lng: 68.0 },
      "US": { name: "США", reg: "Северная Америка", fb: "82%", cards: "94%", gambling: "17%", lat: 37.0, lng: -95.7 },
      "DE": { name: "Германия", reg: "Западная Европа", fb: "62%", cards: "96%", gambling: "11%", lat: 51.1, lng: 10.4 },
      "PL": { name: "Польша", reg: "Восточная Европа", fb: "71%", cards: "92%", gambling: "13%", lat: 51.9, lng: 19.1 },
      "GB": { name: "Великобритания", reg: "Западная Европа", fb: "78%", cards: "95%", gambling: "18%", lat: 55.3, lng: -3.4 },
      "BR": { name: "Бразилия", reg: "Южная Америка", fb: "75%", cards: "73%", gambling: "29%", lat: -14.2, lng: -51.9 },
      "FR": { name: "Франция", reg: "Западная Европа", fb: "65%", cards: "94%", gambling: "12%", lat: 46.2, lng: 2.2 },
      "IT": { name: "Италия", reg: "Южная Европа", fb: "60%", cards: "88%", gambling: "15%", lat: 41.8, lng: 12.5 },
      "ES": { name: "Испания", reg: "Южная Европа", fb: "68%", cards: "91%", gambling: "16%", lat: 40.4, lng: -3.7 },
      "TR": { name: "Турция", reg: "Ближний Восток", fb: "58%", cards: "78%", gambling: "22%", lat: 38.9, lng: 35.2 },
      "CA": { name: "Канада", reg: "Северная Америка", fb: "79%", cards: "96%", gambling: "14%", lat: 56.1, lng: -106.3 },
      "AU": { name: "Австралия", reg: "Океания", fb: "77%", cards: "95%", gambling: "24%", lat: -25.2, lng: 133.7 },
      "NL": { name: "Нидерланды", reg: "Западная Европа", fb: "74%", cards: "98%", gambling: "9%", lat: 52.1, lng: 5.2 },
      "AE": { name: "ОАЭ", reg: "Ближний Восток", fb: "93%", cards: "92%", gambling: "11%", lat: 23.4, lng: 53.8 },
      "SG": { name: "Сингапур", reg: "Юго-Восточная Азия", fb: "85%", cards: "97%", gambling: "15%", lat: 1.3, lng: 103.8 },
      "CH": { name: "Швейцария", reg: "Западная Европа", fb: "59%", cards: "98%", gambling: "8%", lat: 46.8, lng: 8.2 },
      "UZ": { name: "Узбекистан", reg: "Азия / СНГ", fb: "35%", cards: "64%", gambling: "19%", lat: 41.3, lng: 69.2 },
      "GE": { name: "Грузия", reg: "Кавказ / СНГ", fb: "66%", cards: "79%", gambling: "25%", lat: 42.3, lng: 43.3 },
      "RU": { name: "Россия", reg: "Евразия", fb: "25%", cards: "91%", gambling: "16%", lat: 61.5, lng: 105.3 },
      "CN": { name: "Китай", reg: "Восточная Азия", fb: "10%", cards: "95%", gambling: "7%", lat: 35.8, lng: 104.1 },
      "IN": { name: "Индия", reg: "Южная Азия", fb: "42%", cards: "58%", gambling: "14%", lat: 20.5, lng: 78.9 },
      "MX": { name: "Мексика", reg: "Центральная Америка", fb: "71%", cards: "62%", gambling: "19%", lat: 23.6, lng: -102.5 },
      "AR": { name: "Аргентина", reg: "Южная Америка", fb: "69%", cards: "71%", gambling: "22%", lat: -38.4, lng: -63.6 },
      "ZA": { name: "ЮАР", reg: "Африка", fb: "49%", cards: "67%", gambling: "26%", lat: -30.5, lng: 25.0 },
      "IE": { name: "Ирландия", reg: "Западная Европа", fb: "76%", cards: "94%", gambling: "13%", lat: 53.4, lng: -8.2 }
    };

    const markersData = Object.entries(massiveDatabase).map(([iso, data]) => ({
      iso: iso,
      name: data.name,
      lat: data.lat,
      lng: data.lng
    }));

    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttIso = document.getElementById('tt-iso');
    const ttPop = document.getElementById('tt-pop');
    const ttFb = document.getElementById('tt-fb');
    const ttCards = document.getElementById('tt-cards');
    const ttGambling = document.getElementById('tt-gambling');

    function updateDashboard(iso, data) {
      ttTitle.textContent = data.name;
      ttIso.textContent = iso;
      ttPop.textContent = data.reg;
      ttFb.textContent = data.fb;
      ttCards.textContent = data.cards;
      ttGambling.textContent = data.gambling;
    }

    function initApp() {
      // Инициализируем глобус через объект, предоставленный Globe.gl
      world = Globe()
        (document.getElementById('globe-container'))
        .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
        
        .labelsData(markersData)
        .labelLat(d => d.lat)
        .labelLng(d => d.lng)
        .labelText(d => d.name)
        .labelSize(1.8)
        .labelDotRadius(d => (d.iso === activeSearchCountryIso) ? 3.8 : 1.5)
        .labelColor(d => (d.iso === activeSearchCountryIso) ? '#00f0ff' : 'rgba(0, 240, 255, 0.9)')
        .labelResolution(6)
        
        .onLabelHover(hoverD => {
          if (hoverD) {
            const data = massiveDatabase[hoverD.iso];
            if (data) updateDashboard(hoverD.iso, data);
          }
        });

      world.controls().autoRotate = true;
      world.controls().autoRotateSpeed = 0.25;
      world.controls().enableDamping = true;
    }

    function handleSearch() {
      const query = document.getElementById('search-in').value.trim().toUpperCase();
      if (!query || !world) return;

      let targetIso2 = null;

      if (massiveDatabase[query]) {
        targetIso2 = query;
      } else {
        for (const [iso, data] of Object.entries(massiveDatabase)) {
          if (data.name && data.name.toUpperCase().includes(query)) {
            targetIso2 = iso;
            break;
          }
        }
      }

      if (targetIso2) {
        const country = massiveDatabase[targetIso2];
        activeSearchCountryIso = targetIso2;
        
        world.labelsData(markersData);
        world.controls().autoRotate = false;
        
        world.pointOfView({ lat: country.lat, lng: country.lng, altitude: 1.3 }, 1500);
        updateDashboard(targetIso2, country);
      } else {
        alert('ГЕО не найдено в базе. Доступны: Украина, Казахстан, Нидерланды, США, Германия...');
      }
    }

    document.getElementById('search-btn').addEventListener('click', handleSearch);
    document.getElementById('search-in').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    // Запуск корректной инициализации
    initApp();
  </script>
</body>
</html>
