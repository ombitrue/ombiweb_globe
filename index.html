<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard v17.0 Emergency</title>
  <style>
    body { margin: 0; background-color: #050811; color: #fff; font-family: sans-serif; overflow: hidden; }
    
    /* ФИЗИЧЕСКИЙ КОНТЕЙНЕР */
    #map-surface {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #1e293b 0%, #020617 70%);
      display: flex; align-items: center; justify-content: center;
    }

    /* МАРКЕРЫ КАК КНОПКИ */
    .geo-btn {
      position: absolute; padding: 8px 12px; background: #00f0ff; color: #000;
      border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer;
      border: none; box-shadow: 0 0 10px #00f0ff;
    }

    .tooltip {
      position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8);
      padding: 20px; border: 1px solid #00f0ff; border-radius: 10px; z-index: 100;
    }
  </style>
</head>
<body>

  <div id="map-surface">
    <h1 style="color: #64748b; font-size: 24px;">LOADING GEO DATA...</h1>
  </div>

  <div class="tooltip" id="ui">
    <h3>Global Monitoring</h3>
    <p id="info">Select a country</p>
  </div>

  <script>
    const data = {
      "Nigeria": { top: "50%", left: "48%", fb: "46%", cards: "38%", gamble: "32%" },
      "Senegal": { top: "48%", left: "45%", fb: "41%", cards: "39%", gamble: "15%" },
      "Cameroon": { top: "53%", left: "51%", fb: "33%", cards: "28%", gamble: "26%" },
      "Mali": { top: "45%", left: "46%", fb: "25%", cards: "17%", gamble: "20%" },
      "Ethiopia": { top: "50%", left: "58%", fb: "16%", cards: "22%", gamble: "11%" }
    };

    const surface = document.getElementById('map-surface');
    
    // Рендерим маркеры прямо в DOM
    Object.entries(data).forEach(([name, pos]) => {
      const btn = document.createElement('button');
      btn.className = 'geo-btn';
      btn.textContent = name;
      btn.style.top = pos.top;
      btn.style.left = pos.left;
      btn.onclick = () => {
        document.getElementById('info').innerHTML = 
          `<b>${name}</b><br>FB: ${pos.fb}<br>Cards: ${pos.cards}<br>Gamble: ${pos.gamble}`;
      };
      surface.appendChild(btn);
    });

    surface.querySelector('h1').style.display = 'none';
  </script>
</body>
</html>
