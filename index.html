<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Global Monitoring</title>
    <style>
        body { margin: 0; background: #020617; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 20px; border: 1px solid #00f0ff; border-radius: 10px; width: 280px; }
        .search { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
        input { background: #000; border: 1px solid #00f0ff; color: #fff; padding: 10px; border-radius: 5px; }
        button { background: #00f0ff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="ui" id="ui">
    <h3 id="c-name">Выбор страны</h3>
    <p id="c-stats">Нажми на точку на глобусе</p>
</div>

<div class="search">
    <input type="text" id="q" placeholder="ISO (NG, SN, CM, ET...)">
    <button onclick="find()">Найти</button>
</div>

<canvas id="cvs"></canvas>

<script>
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
// База данных (x, y от 0 до 1 — это положение на карте)
const points = [
    { iso: "NG", name: "Nigeria", x: 0.52, y: 0.55, fb: "46%", cards: "38%", g: "32%" },
    { iso: "SN", name: "Senegal", x: 0.42, y: 0.50, fb: "41%", cards: "39%", g: "15%" },
    { iso: "CM", name: "Cameroon", x: 0.58, y: 0.58, fb: "33%", cards: "28%", g: "26%" },
    { iso: "ET", name: "Ethiopia", x: 0.68, y: 0.52, fb: "16%", cards: "22%", g: "11%" },
    { iso: "ML", name: "Mali", x: 0.48, y: 0.45, fb: "25%", cards: "17%", g: "20%" },
    { iso: "CI", name: "Cote d'Ivoire", x: 0.44, y: 0.54, fb: "38%", cards: "34%", g: "24%" },
    { iso: "BF", name: "Burkina Faso", x: 0.46, y: 0.48, fb: "22%", cards: "19%", g: "18%" },
    { iso: "UA", name: "Ukraine", x: 0.60, y: 0.30, fb: "68%", cards: "84%", g: "14%" }
];

function draw() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    const r = Math.min(cvs.width, cvs.height) * 0.35;
    const cx = cvs.width/2, cy = cvs.height/2;

    // Глобус (фон)
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.strokeStyle = "#00f0ff"; ctx.lineWidth = 2; ctx.stroke();

    // Маркеры
    points.forEach(p => {
        const px = cx + (p.x - 0.5) * r * 2;
        const py = cy + (p.y - 0.5) * r * 2;
        ctx.fillStyle = "#ff0055";
        ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "white";
        ctx.fillText(p.name, px + 10, py);
    });
}

function find() {
    const val = document.getElementById('q').value.toUpperCase();
    const p = points.find(i => i.iso === val);
    if(p) {
        document.getElementById('c-name').innerText = p.name;
        document.getElementById('c-stats').innerHTML = `FB: ${p.fb}<br>Cards: ${p.cards}<br>Gamble: ${p.g}`;
    } else {
        alert("Страна не найдена. Попробуй: NG, SN, CM, ET, ML, CI, BF, UA");
    }
}

window.onresize = () => { cvs.width = window.innerWidth; cvs.height = window.innerHeight; draw(); };
window.onresize();
</script>
</body>
</html>
