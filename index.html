<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Global Globe v20.0</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    body { margin: 0; background-color: #020617; overflow: hidden; }
    #globe { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="globe"></div>
  <script>
    const countries = [
      { name: "Nigeria", lat: 9.08, lng: 8.67, fb: "46%", cards: "38%" },
      { name: "Senegal", lat: 14.49, lng: -14.45, fb: "41%", cards: "39%" },
      { name: "Cameroon", lat: 7.37, lng: 12.35, fb: "33%", cards: "28%" },
      { name: "Mali", lat: 17.57, lng: -3.99, fb: "25%", cards: "17%" },
      { name: "Ethiopia", lat: 9.14, lng: 40.48, fb: "16%", cards: "22%" },
      { name: "Cote d'Ivoire", lat: 7.54, lng: -5.55, fb: "38%", cards: "34%" },
      { name: "Burkina Faso", lat: 12.23, lng: -1.56, fb: "22%", cards: "19%" },
      { name: "Kenya", lat: -0.02, lng: 37.90, fb: "39%", cards: "74%" }
    ];

    const myGlobe = Globe()
      (document.getElementById('globe'))
      .backgroundColor('#020617')
      .globeColor('#1e293b') // Цвет самого шара
      .showGraticules(true)  // Сетка координат
      .atmosphereColor('#00f0ff')
      .atmosphereAltitude(0.25)
      .labelsData(countries)
      .labelLat(d => d.lat)
      .labelLng(d => d.lng)
      .labelText(d => d.name)
      .labelSize(1.5)
      .labelDotRadius(0.8)
      .labelColor(() => '#00f0ff')
      .labelResolution(2);

    // Авто-вращение
    myGlobe.controls().autoRotate = true;
    myGlobe.controls().autoRotateSpeed = 0.5;
  </script>
</body>
</html>
