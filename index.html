<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Global Globe v21.0 Stable</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    body { margin: 0; background-color: #040814; color: #fff; font-family: sans-serif; overflow: hidden; }
    #globe-container { width: 100vw; height: 100vh; }
    
    /* Твой интерфейс */
    .ui-panel { position: absolute; top: 25px; left: 25px; z-index: 10; background: rgba(10, 16, 35, 0.9); border: 1px solid #00f0ff; padding: 20px; border-radius: 12px; }
    .search-panel { position: absolute; top: 25px; right: 25px; z-index: 10; display: flex; gap: 10px; }
    input { background: #000; border: 1px solid #00f0ff; color: #fff; padding: 10px; border-radius: 8px; }
    button { background: #00f0ff; color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="ui-panel" id="ui">
    <h3 id="tt-title">Global Monitoring</h3>
    <p>ISO: <span id="tt-iso">WORLD</span></p>
    <p id="tt-reg">Select a country</p>
  </div>

  <div class="search-panel">
    <input type="text" id="search" placeholder="Search GEO...">
    <button onclick="handleSearch()">Search</button>
  </div>

  <div id="globe-container"></div>

  <script>
    const database = {
      "NG": { name: "Nigeria", reg: "W. Africa", fb: "46%", lat: 9.08, lng: 8.67 },
      "SN": { name: "Senegal", reg: "W. Africa", fb: "41%", lat: 14.49, lng: -14.45 },
      "CM": { name: "Cameroon", reg: "C. Africa", fb: "33%", lat: 7.37, lng: 12.35 },
      "ET": { name: "Ethiopia", reg: "E. Africa", fb: "16%", lat: 9.14, lng: 40.48 },
      "CI": { name: "Cote d'Ivoire", reg: "W. Africa", fb: "38%", lat: 7.54, lng: -5.55 }
    };

    const world = Globe()(document.getElementById('globe-container'))
      .globeColor('#1e293b')
      .showGraticules(true)
      .atmosphereColor('#00f0ff')
      .atmosphereAltitude(0.2)
      .labelsData(Object.values(database))
      .labelLat(d => d.lat)
      .labelLng(d => d.lng)
      .labelText(d => d.name)
      .labelColor(() => '#00f0ff')
      .onLabelClick(d => {
        document.getElementById('tt-title').innerText = d.name;
        document.getElementById('tt-iso').innerText = d.fb;
        document.getElementById('tt-reg').innerText = d.reg;
      });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    function handleSearch() {
      const val = document.getElementById('search').value;
      alert("Searching for: " + val);
    }
  </script>
</body>
</html>
