<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глобальный Гео-Дашборд v8.0 Stable</title>
  
  <script src="https://unpkg.com/globe.gl"></script>
  
  <style>
    body {
      margin: 0;
      background-color: #03060f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
      user-select: none;
    }
    #globe-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0; left: 0;
    }
    
    /* ПОИСК: Справа вверху */
    .search-panel {
      position: absolute;
      top: 25px; right: 25px;
      z-index: 1000;
      background: rgba(10, 15, 30, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 240, 255, 0.1);
      backdrop-filter: blur(12px);
      display: flex; gap: 10px;
    }
    .search-input {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      width: 240px;
    }
    .search-btn {
      background: #00f0ff; color: #050811;
      border: none; border-radius: 8px;
      padding: 10px 20px; font-weight: 700; cursor: pointer;
      font-size: 14px; transition: all 0.2s;
    }
    .search-btn:hover { background: #00bfff; box-shadow: 0 0 12px rgba(0, 240, 255, 0.4); }

    /* ДАШБОРД: Слева вверху */
    .custom-tooltip {
      position: absolute;
      top: 25px; left: 25px;
      background: rgba(6, 10, 23, 0.95);
      border: 1px solid #00f0ff;
      border-radius: 14px;
      padding: 20px; 
      color: #fff; 
      font-size: 14px;
      pointer-events: none;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 240, 255, 0.25);
      z-index: 1000; 
      min-width: 310px;
      backdrop-filter: blur(15px);
    }
    .tooltip-title {
      font-size: 22px; font-weight: 700; margin-bottom: 14px;
      color: #00f0ff; border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 8px;
    }
    .metric { display: flex; justify-content: space-between; margin: 11px 0; }
    .metric-label { color: #a0aec0; }
    .metric-value { font-weight: 600; color: #ffffff; }
    .highlight-fb { color: #1877F2; }
    .highlight-cards { color: #4cd964; }
    .highlight-gambling { color: #ff3b30; }
  </style>
</head>
<body>

  <div class="search-panel">
    <input type="text" id="search-in" class="search-input" placeholder="Поиск (Украина, Казахстан, US)...">
    <button id="search-btn" class="search-btn">Найти</button>
  </div>

  <div id="globe-container"></div>
  
  <div id="tooltip" class="custom-tooltip">
    <div id="tt-title" class="tooltip-title">Глобальный Мониторинг</div>
    <div class="metric"><span class="metric-label">ISO 2 Код:</span> <span id="tt-iso" class="metric-value" style="color: #a0aec0;">WORLD</span></div>
    <div class="metric"><span class="metric-label">Регион ГЕО:</span> <span id="tt-pop" class="metric-value">Вся планета</span></div>
    <div class="metric"><span class="metric-label">Охват Facebook:</span> <span id="tt-fb" class="metric-value highlight-fb">Стабилен</span></div>
    <div class="metric"><span class="metric-label">Банк. карты / Моб:</span> <span id="tt-cards" class="metric-value highlight-cards">Онлайн</span></div>
    <div class="metric"><span class="metric-label">Риск гемблинга:</span> <span id="tt-gambling" class="metric-value highlight-gambling">Анализ</span></div>

      "BE": { name: "Бельгия", reg: "Западная Европа", fb: "67%", cards: "96%", gambling: "11%", lat: 50.5, lng: 4.4 },
      "IE": { name: "Ирландия", reg: "Западная Европа", fb: "76%", cards: "94%", gambling: "13%", lat: 53.4, lng: -8.2 },
      "PT": { name: "Португалия", reg: "Южная Европа", fb: "72%", cards: "89%", gambling: "15%", lat: 39.3, lng: -8.2 },
      "GR": { name: "Греция", reg: "Южная Европа", fb: "63%", cards: "84%", gambling: "17%", lat: 39.0, lng: 21.8 },
      "CZ": { name: "Чехия", reg: "Центральная Европа", fb: "69%", cards: "93%", gambling: "14%", lat: 49.8, lng: 15.4 },
      "RO": { name: "Румыния", reg: "Восточная Европа", fb: "66%", cards: "74%", gambling: "18%", lat: 45.9, lng: 24.9 },
      "HU": { name: "Венгрия", reg: "Центральная Европа", fb: "71%", cards: "87%", gambling: "13%", lat: 47.1, lng: 19.5 },
      "BG": { name: "Болгария", reg: "Восточная Европа", fb: "60%", cards: "71%", gambling: "16%", lat: 42.7, lng: 25.2 }
    };

    const markersData = Object.entries(massiveDatabase).map(([iso, data]) => ({
      iso: iso,
      name: data.name,
      lat: data.lat,
      lng: data.lng
    }));

    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttIso = document.getElementById('tt-iso');
    const ttPop = document.getElementById('tt-pop');
    const ttFb = document.getElementById('tt-fb');
    const ttCards = document.getElementById('tt-cards');
    const ttGambling = document.getElementById('tt-gambling');

    function updateDashboard(iso, data) {
      ttTitle.textContent = data.name;
      ttIso.textContent = iso;
      ttPop.textContent = data.reg;
      ttFb.textContent = data.fb;
      ttCards.textContent = data.cards;
      ttGambling.textContent = data.gambling;
    }

    function initApp() {
      // Инициализируем глобус. Процедурный рендер гарантирует 100% запуск без ошибок CORS/CSP
      world = Globe()
        (document.getElementById('globe-container'))
        .globeColor('#070c19') // Высокотехнологичный глубокий сине-черный цвет сферы
        .showAtmosphere(true)
        .atmosphereColor('#00f0ff')
        .atmosphereAltitude(0.18)
        
        // Отрисовка интерактивных маркеров активности стран
        .labelsData(markersData)
        .labelLat(d => d.lat)
        .labelLng(d => d.lng)
        .labelText(d => d.name)
        .labelSize(1.8)
        .labelDotRadius(d => (d.iso === activeSearchCountryIso) ? 3.8 : 1.4)
        .labelColor(d => (d.iso === activeSearchCountryIso) ? '#00f0ff' : 'rgba(0, 240, 255, 0.85)')
        .labelResolution(6)
        
        // Мгновенный локальный ховер
        .onLabelHover(hoverD => {
          if (hoverD) {
            const data = massiveDatabase[hoverD.iso];
            if (data) updateDashboard(hoverD.iso, data);
          }
        });

      world.controls().autoRotate = true;
      world.controls().autoRotateSpeed = 0.3;
      world.controls().enableDamping = true;
    }

    function handleSearch() {
      const query = document.getElementById('search-in').value.trim().toUpperCase();
      if (!query || !world) return;

      let targetIso2 = null;

      // Поиск по ISO коду (UA, US, KZ...)
      if (massiveDatabase[query]) {
        targetIso2 = query;
      } else {
        // Поиск по русскому названию
        for (const [iso, data] of Object.entries(massiveDatabase)) {
          if (data.name && data.name.toUpperCase().includes(query)) {
            targetIso2 = iso;
            break;
          }
        }
      }

      if (targetIso2) {
        const country = massiveDatabase[targetIso2];
        activeSearchCountryIso = targetIso2;
        
        // Перерисовываем маркеры, чтобы зажечь выбранную точку
        world.labelsData(markersData);
        world.controls().autoRotate = false;
        
        // Красивый плавный подлет камеры к стране
        world.pointOfView({ lat: country.lat, lng: country.lng, altitude: 1.3 }, 1500);
        updateDashboard(targetIso2, country);
      } else {
        alert('ГЕО не найдено в базе данных. Попробуйте: Украина, Казахстан, Узбекистан, США, Германия, ОАЭ...');
      }
    }

    document.getElementById('search-btn').addEventListener('click', handleSearch);
    document.getElementById('search-in').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    // Запуск приложения
    initApp();
  </script>
</body>
</html>
